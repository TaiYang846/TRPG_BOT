<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劇本 JSON 產生器</title>
<style>
  :root {
    --paper: #f3ede2;
    --paper-deep: #e8dfd0;
    --ink: #2b2622;
    --ink-soft: #5c5346;
    --stamp: #8a3324;
    --stamp-soft: #b85c47;
    --line: #d8cdb8;
    --ok: #3f6d4f;
    --card: #fbf8f2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(138,51,36,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(138,51,36,0.04), transparent 45%);
    color: var(--ink);
    font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif;
    line-height: 1.6;
  }

  header {
    padding: 40px 24px 20px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }

  header .eyebrow {
    letter-spacing: 0.35em;
    font-size: 12px;
    color: var(--stamp);
    text-transform: uppercase;
  }

  header h1 {
    margin: 10px 0 6px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px 60px;
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 28px;
  }

  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(43,38,34,0.04);
  }

  .form-card { padding: 28px 26px 30px; }

  .section-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 30px 0 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--stamp);
  }
  .section-title:first-child { margin-top: 0; }
  .section-title .num {
    font-family: Georgia, serif;
    font-size: 13px;
    border: 1px solid var(--stamp-soft);
    color: var(--stamp-soft);
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 14px 0 5px;
  }
  label .hint { font-size: 11px; color: #a0968a; }
  label .req { color: var(--stamp); margin-left: 2px; }

  input[type="text"], input[type="url"], input[type="number"], textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fffdf9;
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--stamp-soft);
    box-shadow: 0 0 0 3px rgba(138,51,36,0.08);
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .npc-block {
    border: 1px dashed var(--line);
    border-radius: 5px;
    padding: 14px 14px 6px;
    margin-top: 14px;
    position: relative;
    background: rgba(232,223,208,0.35);
  }
  .npc-block .npc-remove {
    position: absolute;
    top: 10px;
    right: 10px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  .btn-add {
    margin-top: 14px;
    background: transparent;
    border: 1px solid var(--stamp-soft);
    color: var(--stamp);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 13px;
  }
  .btn-add:hover { background: rgba(138,51,36,0.06); }

  .btn-remove {
    background: transparent;
    color: #a0968a;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--line);
  }
  .btn-remove:hover { color: var(--stamp); border-color: var(--stamp-soft); }

  /* right column */
  .preview-card {
    position: sticky;
    top: 20px;
    align-self: start;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 40px);
  }

  .preview-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .preview-head .filename {
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .preview-head .filename strong { color: var(--ink); }

  .actions { display: flex; gap: 8px; }

  .btn-primary, .btn-secondary {
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--stamp);
    color: var(--paper);
  }
  .btn-primary:hover { background: var(--stamp-soft); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .btn-secondary:hover { border-color: var(--stamp-soft); color: var(--stamp); }

  #copyStatus {
    font-size: 12px;
    color: var(--ok);
    margin-left: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #copyStatus.show { opacity: 1; }

  pre#jsonOutput {
    margin: 0;
    padding: 20px 22px 26px;
    overflow: auto;
    font-family: "SF Mono", "Courier New", monospace;
    font-size: 12.5px;
    color: var(--ink);
    white-space: pre;
    flex: 1;
  }

  .json-key { color: #8a3324; }
  .json-string { color: #3f6d4f; }
  .json-num { color: #6b5a3e; }
  .json-punc { color: #a0968a; }

  .warn-name {
    font-size: 12px;
    color: var(--stamp);
    margin-top: 6px;
    min-height: 14px;
  }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 10px 20px 40px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Scenario Card Generator</div>
  <h1>劇本 JSON 產生器</h1>
  <p>填好左邊的表單，右邊就會即時組出格式正確的 JSON，複製或下載後貼到 GitHub 的 scenarios 資料夾即可</p>
</header>

<div class="wrap">

  <div class="card form-card">

    <div class="section-title"><span class="num">1</span> 基本資料</div>

    <label>劇本名稱<span class="req">*</span><span class="hint">　（也會是檔名，例如「血染鐘樓」→ scenarios/血染鐘樓.json）</span></label>
    <input type="text" id="f_name" placeholder="例如：血染鐘樓">
    <div class="warn-name" id="nameWarn"></div>

    <label>標語 Slogan<span class="hint">（選填，會顯示在劇本名稱正下方，當作一句話標語）</span></label>
    <input type="text" id="f_slogan" placeholder="例如：在謊言與真相之間，尋找唯一的出口">

    <div class="row2">
      <div>
        <label>作者</label>
        <input type="text" id="f_author" placeholder="例如：無名跑團社">
      </div>
      <div>
        <label>劇本網址<span class="hint">（選填）</span></label>
        <input type="url" id="f_url" placeholder="https://...">
      </div>
    </div>

    <label>別名／搜尋關鍵字<span class="hint">（選填，用逗號分隔，例如中文翻譯、簡稱）</span></label>
    <input type="text" id="f_aliases" placeholder="例如：美術館, テロ, 沉默的恐怖分子">

    <div class="row2">
      <div>
        <label>最少人數<span class="hint">（選填，單人本填 1）</span></label>
        <input type="number" id="f_players_min" min="1" placeholder="例如：3">
      </div>
      <div>
        <label>最多人數<span class="hint">（選填）</span></label>
        <input type="number" id="f_players_max" min="1" placeholder="例如：5">
      </div>
    </div>

    <label>劇本封面圖網址<span class="hint">（選填，傳圖到 Discord 頻道後對圖片按右鍵複製連結）</span></label>
    <input type="text" id="f_image" placeholder="https://...">

    <div class="section-title"><span class="num">2</span> 詳細內容</div>

    <label>背景<span class="hint">（選填，換行請直接按 Enter，會自動處理）</span></label>
    <textarea id="f_background" rows="4" placeholder="世界觀、開場故事..."></textarea>

    <label>概要<span class="hint">（建議填寫，會顯示在「背景」下方的獨立欄位）</span></label>
    <textarea id="f_summary" rows="4" placeholder="劇情簡介..."></textarea>

    <label>公開HO<span class="hint">（選填，可以列出多個 HO，換行按 Enter 即可）</span></label>
    <textarea id="f_public_ho" rows="5" placeholder="HO1 - 名稱：簡短描述&#10;HO2 - 名稱：簡短描述"></textarea>

    <div class="row2">
      <div>
        <label>注意事項<span class="hint">（沒有請填「無」）</span></label>
        <input type="text" id="f_warning" placeholder="無" value="無">
      </div>
      <div>
        <label>其他<span class="hint">（選填）</span></label>
        <input type="text" id="f_other" placeholder="補充事項...">
      </div>
    </div>

    <label>HO 診斷網址<span class="hint">（選填，玩家自己測驗分配角色的連結，跟公開HO是不同東西）</span></label>
    <input type="url" id="f_ho_url" placeholder="https://...">

    <div class="section-title"><span class="num">3</span> NPC 名單<span class="hint" style="margin-left:6px;">（選填）</span></div>
    <div id="npcContainer"></div>
    <button class="btn-add" id="addNpcBtn" type="button">＋ 新增一位 NPC</button>

  </div>

  <div class="card preview-card">
    <div class="preview-head">
      <div class="filename">檔名：scenarios/<strong id="filenamePreview">劇本名稱</strong>.json</div>
      <div class="actions">
        <button class="btn-secondary" id="downloadBtn" type="button">下載 .json</button>
        <button class="btn-primary" id="copyBtn" type="button">複製 JSON</button>
        <span id="copyStatus">已複製！</span>
      </div>
    </div>
    <pre id="jsonOutput"></pre>
  </div>

</div>

<footer>這個工具完全在你的瀏覽器裡運作，不會把任何資料傳到任何伺服器。</footer>

<script>
const npcContainer = document.getElementById('npcContainer');
let npcCount = 0;

function addNpcRow(prefill) {
  npcCount++;
  const id = npcCount;
  const div = document.createElement('div');
  div.className = 'npc-block';
  div.dataset.npcId = id;
  div.innerHTML = `
    <button type="button" class="btn-remove npc-remove" onclick="this.closest('.npc-block').remove(); renderJSON();">移除</button>
    <label>NPC 名稱</label>
    <input type="text" class="npc-name" placeholder="例如：老鐘樓管理員">
    <label>NPC 簡介</label>
    <textarea class="npc-desc" rows="2" placeholder="簡短介紹這個 NPC..."></textarea>
    <label>NPC 圖片網址<span class="hint">（選填）</span></label>
    <input type="text" class="npc-image" placeholder="https://...">
  `;
  npcContainer.appendChild(div);

  div.querySelectorAll('input, textarea').forEach(el => el.addEventListener('input', renderJSON));
}

document.getElementById('addNpcBtn').addEventListener('click', () => addNpcRow());

function splitLines(text) {
  return text.split('\n').join('\\n');
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function syntaxHighlight(jsonString) {
  const escaped = escapeHtml(jsonString);
  return escaped.replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    (match) => {
      let cls = 'json-num';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'json-key' : 'json-string';
      } else if (/true|false/.test(match)) {
        cls = 'json-punc';
      }
      return `<span class="${cls}">${match}</span>`;
    }
  );
}

function buildScenarioObject() {
  const name = document.getElementById('f_name').value.trim();

  const aliasesRaw = document.getElementById('f_aliases').value.trim();
  const aliases = aliasesRaw
    ? aliasesRaw.split(',').map(s => s.trim()).filter(Boolean)
    : [];

  const pMinRaw = document.getElementById('f_players_min').value.trim();
  const pMaxRaw = document.getElementById('f_players_max').value.trim();

  const npcs = {};
  npcContainer.querySelectorAll('.npc-block').forEach(block => {
    const nName = block.querySelector('.npc-name').value.trim();
    if (!nName) return;
    npcs[nName] = {
      description: block.querySelector('.npc-desc').value.trim(),
      image: block.querySelector('.npc-image').value.trim()
    };
  });

  const data = {
    author: document.getElementById('f_author').value.trim(),
    slogan: document.getElementById('f_slogan').value.trim(),
    url: document.getElementById('f_url').value.trim(),
    aliases: aliases,
    image: document.getElementById('f_image').value.trim(),
  };

  if (pMinRaw !== '' && pMaxRaw !== '') {
    data.players_min = parseInt(pMinRaw, 10);
    data.players_max = parseInt(pMaxRaw, 10);
  }

  data.background = document.getElementById('f_background').value;
  data.summary = document.getElementById('f_summary').value;
  data.public_ho = document.getElementById('f_public_ho').value;
  data.warning = document.getElementById('f_warning').value.trim() || '無';
  data.other = document.getElementById('f_other').value.trim();
  data.ho_url = document.getElementById('f_ho_url').value.trim();
  data.npcs = npcs;

  return { name, data };
}

function renderJSON() {
  const { name, data } = buildScenarioObject();

  document.getElementById('filenamePreview').textContent = name || '劇本名稱';

  const nameWarn = document.getElementById('nameWarn');
  nameWarn.textContent = name ? '' : '請先填寫劇本名稱（會用來當作檔名）';

  const jsonStr = JSON.stringify(data, null, 2);
  document.getElementById('jsonOutput').innerHTML = syntaxHighlight(jsonStr);

  window._currentScenario = { name, jsonStr };
}

document.querySelectorAll('#f_name, #f_author, #f_slogan, #f_url, #f_aliases, #f_players_min, #f_players_max, #f_image, #f_background, #f_summary, #f_public_ho, #f_warning, #f_other, #f_ho_url')
  .forEach(el => el.addEventListener('input', renderJSON));

document.getElementById('copyBtn').addEventListener('click', async () => {
  const { jsonStr } = window._currentScenario;
  try {
    await navigator.clipboard.writeText(jsonStr);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = jsonStr;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const status = document.getElementById('copyStatus');
  status.classList.add('show');
  setTimeout(() => status.classList.remove('show'), 1500);
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const { name, jsonStr } = window._currentScenario;
  const filename = (name || '未命名劇本') + '.json';
  const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// 預設先放一個空白 NPC 欄位方便示範
addNpcRow();
renderJSON();
</script>

</body>
</html>
